name: Therapy Center CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore Dependencies
        run: dotnet restore backend/TherapyCenterAPI/TherapyCenterAPI.csproj

      - name: Build Project
        run: dotnet build backend/TherapyCenterAPI/TherapyCenterAPI.csproj --no-restore -c Release

      # - name: Test Backend
      #   run: dotnet test backend/TherapyCenterAPI.Tests/TherapyCenterAPI.Tests.csproj --no-build -c Release

  frontend:
    name: Build & Test Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/therapy-frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci --prefix frontend/therapy-frontend

      - name: Run Linter
        run: npm run lint --prefix frontend/therapy-frontend

      # - name: Run Tests
      #   run: npm run test --prefix frontend/therapy-frontend --run

      - name: Build Frontend
        run: npm run build --prefix frontend/therapy-frontend
